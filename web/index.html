<style>

h1{font-size:1.5rem;margin:8px 0 4px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.p{background:var(--card);border:1px solid transparent;border-radius:12px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.p:hover{border-color:var(--line);box-shadow:0 6px 20px rgba(0,0,0,.06)}
.p .im{height:130px;display:grid;place-items:center;font-size:3.2rem;border-radius:12px}
.p .t{padding:10px 4px;display:grid;gap:2px}

.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:12px 20px;font-weight:600}
.btn:hover{background:var(--accd)}.btn:disabled{background:#ccc}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10;justify-content:flex-end;align-items:center}
.ov.on{display:flex}
.box{background:#fff;width:min(440px,100%);max-height:100%;overflow:auto;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));border-radius:14px;margin:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:none}
.steps{display:flex;gap:6px;margin:8px 0 14px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--acc)}
.f{display:grid;gap:10px}.f input{padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
footer{background:#222;color:#fff;padding:28px 16px;text-align:center}
footer .mu{color:#bbb}
footer form{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
footer input{padding:10px;border-radius:6px;border:0;min-width:0;flex:1 1 200px;max-width:320px;color:#222}

.logo{white-space:nowrap}
.sw{display:flex;border:1px solid var(--line);border-radius:999px;background:#fff;max-width:520px}
.sw input{border:0;background:none;border-radius:999px 0 0 999px;outline-offset:-2px}
.sb{border:0;background:var(--acc);color:#fff;padding:0 18px;border-radius:0 999px 999px 0;display:grid;place-items:center}
#sug{left:0;right:0}
.ic{display:flex;gap:16px}
.ic button{background:none;border:0;display:grid;justify-items:center;font-size:.75rem;gap:2px;position:relative;padding:2px 4px}
.ic .bd{position:absolute;top:-4px;right:-2px;background:var(--acc);color:#fff;border-radius:999px;min-width:18px;height:18px;font:600 .7rem/18px Montserrat,sans-serif;text-align:center;font-style:normal}
@media (max-width:640px){.sw{order:3;flex:1 1 100%;max-width:none}header{gap:10px}}
nav{background:var(--acc)}
.hero>div#hb{background:var(--soft);border-radius:14px;padding:36px 32px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;min-height:200px}
.hero h1{text-transform:uppercase;margin:0}
.hero h1 small{display:block;font-size:.55em;color:var(--mute);font-weight:600}
.art{font-size:3.4rem;letter-spacing:6px;text-align:center}
@media (max-width:640px){.hero>div#hb{grid-template-columns:1fr;padding:22px 18px;min-height:0}.art{font-size:2.2rem;order:-1}}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots button{width:8px;height:8px;border-radius:99px;border:0;background:#d0d0d0;padding:0}.dots button.on{width:26px;background:var(--acc)}
.fw{max-width:1200px;margin:22px auto 0;padding:0 16px}
.fh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}.fh h2{margin:0;font-size:1.3rem}
.lk{background:none;border:0;color:var(--acc);font-weight:600}
.tm{display:flex;gap:4px;justify-content:center;padding:10px 0 0}
.tm b{background:#222;color:#fff;border-radius:4px;font:600 .75rem/1 Montserrat,sans-serif;padding:6px 5px}.tm b.o{background:var(--acc)}
.pr.red{color:#d92d20}.p s{margin-right:6px}
main{grid-template-columns:1fr}
aside{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;padding:12px 16px}
aside label{flex:1 1 160px}
.fc{max-width:1200px;margin:auto;display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));text-align:left}
.fc p{margin:6px 0 0}.fc form{display:flex;gap:8px;margin-top:8px}.fc input{flex:1;min-width:0}
.fcart{position:fixed;right:0;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--acc);color:#fff;border:0;border-radius:10px 0 0 10px;padding:12px 14px;font-weight:600}
.hero>div.dots{background:none;padding:0;border-radius:0}

a.logo{color:inherit;text-decoration:none}
.hero>div#hb{display:flex;gap:0;padding:0;min-height:0;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
#hb::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:start;display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;padding:36px 32px;min-height:200px}
@media (max-width:640px){.sl{grid-template-columns:1fr;padding:22px 18px;min-height:0}}
#h{scroll-margin-top:140px}
.fl{display:grid;justify-items:start;margin-top:6px}
.fl button{background:none;border:0;padding:5px 0;color:#bbb;text-align:left}
.fl button:hover{color:#fff;text-decoration:underline}
footer :focus-visible{outline-color:#fff}
.soc{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.soc a{width:40px;height:40px;border-radius:50%;border:1px solid #666;display:grid;place-items:center;color:#fff}
.soc a:hover{background:var(--acc);border-color:var(--acc)}
.f a.btn{display:block;text-align:center;text-decoration:none}

a.logo{color:#111}
.sw{background:#f3f4f8;border-color:#e4e6ee}
.sb{order:-1;background:none;color:var(--ink);border-radius:999px 0 0 999px;padding:0 4px 0 16px}
.sw input{border-radius:0 999px 999px 0;padding-left:10px}
nav button{display:flex;align-items:center;gap:12px;width:100%;padding:15px 0;font-size:1rem;border-bottom:0}

.hero>div#hb{background:linear-gradient(100deg,#fffaf2 0%,#ffefdb 60%,#fde6cb 100%)}
.sl{grid-template-columns:1.25fr 1fr;gap:0;padding:16px 0 16px 16px;min-height:0}
.sl h1{font-size:clamp(1.05rem,5.2vw,1.9rem);line-height:1.1;margin:8px 0 0}
.sl p{margin:8px 0 12px;font-size:.78rem;color:#2b2b2b;max-width:30ch}
.sl .btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:10px 14px;font-size:.8rem}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fcd9bd;color:#b8480f;font:700 .56rem/1.2 Montserrat,sans-serif;padding:4px 9px 4px 4px;border-radius:999px;text-transform:uppercase}
.bz{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--acc);color:#fff}
.art{order:0;display:grid;place-items:center;font-size:2.2rem}
.art img,.im img{max-width:100%;max-height:100%;object-fit:contain}
.art img{width:100%;max-height:170px}
.dots button.on{width:8px}
.fh h2{display:flex;align-items:center;gap:8px;font-size:1.45rem}
.lk{display:flex;align-items:center;gap:6px}
#fl{grid-template-columns:repeat(3,1fr);gap:10px}
.fc2{background:#fff;border:1px solid #ececf0;border-radius:14px;padding:8px;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.pv{display:grid;gap:4px;background:none;border:0;padding:0;text-align:left;position:relative}
.dc{position:absolute;top:0;left:0;z-index:1;background:var(--acc);color:#fff;font:700 .66rem/1 Poppins,sans-serif;padding:4px 8px;border-radius:999px}
.fc2 .im{height:104px;display:grid;place-items:center;font-size:2.4rem}
.nm{font-weight:600;font-size:.74rem;line-height:1.25}
.pp{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px}
.pp b{color:var(--acc);font-size:.8rem}.pp s{color:#999;font-size:.64rem}
.fc2 .add{width:100%;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 4px;font-size:.62rem;border-radius:9px}
.th{display:inline-grid;width:36px;height:36px;vertical-align:middle;place-items:center}
.cl{margin-top:10px}.cl button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 4px;font-weight:600;color:var(--ink)}.cl button.on{color:var(--acc)}
@media (min-width:761px){.sl{grid-template-columns:1.1fr 1fr;padding:28px 40px;min-height:280px}.sl h1{font-size:2.4rem}.sl p{font-size:1rem}.sl .btn{font-size:1rem;padding:12px 20px}.pill{font-size:.72rem}.art img{max-height:240px}#fl{gap:18px}.fc2 .im{height:150px}.nm{font-size:.95rem}.pp b{font-size:1.05rem}.pp s{font-size:.85rem}.fc2 .add{font-size:.85rem;padding:10px}.dc{font-size:.8rem}}
html{background:#fff;color-scheme:light}
body{background:#fff}
@media (max-width:640px){a.logo{font-size:1.15rem}header{gap:8px 10px}.ic{gap:10px}}

.navw{position:relative;z-index:4;background:var(--acc)}
#nav{display:block;overflow:visible;padding:0 max(16px,calc((100% - 1200px)/2))}
#nav .mb{display:flex;align-items:center;gap:12px;width:100%;padding:15px 0;font-size:1rem}
#nav .dm{display:none;list-style:none;margin:0;padding:0;gap:2px}
#nav .dm button{display:block;width:auto;padding:16px 14px;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;border-bottom:3px solid transparent}
#nav .dm button:hover,#nav .dm button[aria-expanded=true]{background:rgba(255,255,255,.14);border-bottom-color:#fff}
.mega{display:none}
@media (min-width:900px){#nav .mb{display:none}#nav .dm{display:flex}.mega{display:block;position:absolute;left:0;right:0;top:100%;background:#fff;box-shadow:0 18px 30px rgba(0,0,0,.12);opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .18s,transform .18s,visibility 0s .18s}.mega.on{opacity:1;visibility:visible;transform:none;transition:opacity .18s,transform .18s}}
.mi{max-width:1200px;margin:0 auto;padding:28px 16px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 36px}
.mc{display:flex;flex-direction:column;align-items:flex-start}
.mc button,.mall{background:none;border:0;padding:6px 0;color:#444;text-align:left}
.mc button:hover,.mall:hover{color:var(--acc)}
.mc .mt{font-weight:700;color:var(--ink);font-size:.95rem;width:100%;padding-bottom:10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.mall{grid-column:1/-1;color:var(--acc);font-weight:600;border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.sov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}

.side{position:fixed;top:0;bottom:0;left:0;width:min(86vw,360px);background:#fff;z-index:20;transform:translateX(-100%);visibility:hidden;transition:transform .28s ease,visibility 0s .28s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.side.on{transform:none;visibility:visible;transition:transform .28s ease}
.sh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-size:1.1rem}
.sx{background:none;border:0;padding:6px;line-height:0;color:var(--ink)}
.sb2{overflow-y:auto;flex:1}
.row2,.lf{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:15px 16px;text-align:left;color:var(--ink);font-size:.95rem}
.row2{font-weight:600}.row2.l0,.lf.l0{text-transform:uppercase;font-size:.85rem;letter-spacing:.03em}
.row2.l1,.lf.l1{padding-left:30px}.row2.l2,.lf.l2{padding-left:44px}.lf.l3{padding-left:58px}
.lf.all,.lf.f{color:var(--acc);font-weight:600}
.pm{font-size:1.4rem;line-height:1;color:var(--acc)}
.ap:not([hidden]){animation:dr .2s}@keyframes dr{from{opacity:0;transform:translateY(-4px)}}
#sug{max-height:70vh;overflow-y:auto;z-index:30}

#sug small{color:var(--mute);font-size:.75rem;white-space:nowrap}
mark{background:none;font-weight:700;color:var(--acc)}
@media (prefers-reduced-motion:reduce){.mega,.side,.sov{transition:none}.ap{animation:none}}

.bc{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:.85rem;color:var(--mute);margin-top:8px}
.bc:empty{display:none}
.bc a{color:inherit;text-decoration:none}.bc a:hover{color:var(--acc);text-decoration:underline}
.bc [aria-current]{color:var(--ink);font-weight:600}
body.cp .hero,body.cp .fw{display:none}
#h:focus{outline:none}
.pg{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:28px}

</style>
</head>

h+='<div class="row"><b>Total</b><b>'+fmt(tot)+'</b></div><p class="mu">Achat sans compte : aucune inscription requise.</p><div style="display:flex;gap:8px"><button class="btn" data-go="2">Passer la commande</button><button class="btn alt" data-x>Continuer</button></div>';open(h)}
function coord(){open('<div class="steps"><i class="on"></i><i class="on"></i><i></i></div><h2>Vos coordonnées</h2><div class="f"><input id="c1" placeholder="Nom complet" autocomplete="name"><input id="c2" type="email" placeholder="E-mail (pour le reçu)" autocomplete="email"><input id="c3" type="tel" placeholder="Téléphone" autocomplete="tel"><input id="c4" placeholder="Adresse de livraison" autocomplete="street-address"><button class="btn" data-go="3">Continuer vers le paiement</button></div><p id="er" class="mu"></p>')}
function loadP(){return fetch(CFG.API+"/products").then(function(r){return r.json()}).then(function(d){P=d.map(function(x){return{id:x.id,n:x.name,c:x.category,pa:(AL[x.category]||x.category)+(x.subcategory?" > "+x.subcategory:""),e:x.emoji,p:x.price,r:x.rating,v:x.reviews,d:x.description,m:x.composition,s:x.stock,col:"#f4f4f4"}});ready=1;nav();list();flash()}).catch(function(){$("g").innerHTML="<p>Impossible de charger les articles. Réessayez dans un instant.</p>"})}
var cust={};
function pay(){var tot=0;Object.keys(cart).forEach(function(k){tot+=P.filter(function(p){return p.id==k})[0].p*cart[k]});open('<div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i></div><h2>Paiement</h2><p>Montant à payer : <b>'+fmt(tot)+'</b></p><p class="mu">Mobile money ou carte bancaire, via KKiaPay.</p><button class="btn" data-go="4">Payer avec KKiaPay</button>')}
function post(u,b){return fetch(CFG.API+u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||"Erreur");return d})})}
function pay2(){var b=document.querySelector('[data-go="4"]');b.disabled=true;b.textContent="Préparation…";
post("/orders",{customer:cust,items:Object.keys(cart).map(function(k){return{id:+k,qty:cart[k]}})}).then(function(o){cur=o.orderId;openKkiapayWidget({amount:o.amount,key:CFG.KKIAPAY_KEY,sandbox:CFG.SANDBOX,name:cust.name,email:cust.email,phone:cust.phone.replace(/\D/g,""),data:o.orderId,reason:"Commande Suppliers Window"})}).catch(function(e){b.disabled=false;b.textContent="Payer avec KKiaPay";alert(e.message)})}
function onOk(r){if(!cur)return;var id=cur;post("/orders/"+id+"/pay",{transactionId:r.transactionId}).then(function(){done(id)}).catch(function(e){open('<h2>Paiement à vérifier</h2><p>'+e.message+' Contactez-nous avec la référence '+id.slice(0,8)+'.</p><button class="btn" data-x>Fermer</button>')})}
function onKo(){open('<h2>Paiement non abouti</h2><p>Aucun montant n\'a été débité. Vous pouvez réessayer.</p><button class="btn" data-go="5">Réessayer</button>')}
function done(id){cart={};cur=null;save();loadP();open('<h2>Merci pour votre commande</h2><p>Un e-mail de confirmation vous est envoyé.</p><a class="btn" style="display:inline-block;text-decoration:none" href="'+CFG.API+'/orders/'+id+'/receipt.pdf" target="_blank" rel="noopener">Télécharger le reçu (PDF)</a> <button class="btn alt" data-x>Retour à la boutique</button>')}
document.addEventListener("click",function(e){var t=e.target.closest("button");if(!t)return;
if(t.dataset.c){close();cm();$("q").value="";sh();goTo(t.dataset.c,1)}else if(t.dataset.pg){if(!t.disabled)goTo(cat,pg+(t.dataset.pg=="next"?1:-1))}else if(t.dataset.ct)contact();else if(t.dataset.side)sideOpen(t);else if(t.dataset.mg!==undefined){var i=+t.dataset.mg;mega(MG==i&&Date.now()-MO>400?null:i)}else if(t.dataset.fl)promo();else if(t.dataset.acc)acc2(t);else if(t.dataset.sx!==undefined)cm();else if(t.dataset.sg||t.dataset.sc||t.dataset.all)sugClick(t);
else if(t.dataset.id)fiche(t.dataset.id);
else if(t.dataset.add){cart[t.dataset.add]=(cart[t.dataset.add]||0)+1;save();panier()}
else if(t.dataset.q){var k=t.dataset.q,x=P.filter(function(p){return p.id==k})[0];cart[k]=Math.max(0,Math.min(x.s,cart[k]+ +t.dataset.d));if(!cart[k])delete cart[k];save();panier()}
else if(t.dataset.go==2)coord();
else if(t.dataset.go==3){if(!$("c1").value||!/\S+@\S+/.test($("c2").value)||!$("c4").value){$("er").textContent="Renseignez votre nom, un e-mail valide et l'adresse de livraison.";return}cust={name:$("c1").value,email:$("c2").value,phone:$("c3").value,address:$("c4").value};pay()}
else if(t.dataset.go==4)pay2();else if(t.dataset.go==5)pay();
else if(t.dataset.x!==undefined)close();
else if(t.dataset.soon)open('<h2>Bientôt disponible</h2><p>Les comptes clients et les favoris arrivent dans la version en ligne.</p><button class="btn" data-x>Fermer</button>');else if(t.dataset.h!==undefined)slide(+t.dataset.h);else if(t.id=="sbt")searchGo();else if(t.id=="cb"||t.id=="cb2")panier();
});
$("ov").addEventListener("click",function(e){if(e.target==$("ov"))close()});
$("q").addEventListener("input",function(){sug();rst()});
["rm","so"].forEach(function(i){$(i).addEventListener("input",rst)});
$("nl").addEventListener("submit",function(e){e.preventDefault();$("nm").textContent="Merci, vous êtes inscrit.";e.target.reset()});
document.querySelector(".logo").addEventListener("click",function(e){e.preventDefault();close();cm();$("q").value="";$("rm").value="0";$("so").value="0";sh();nav();goTo(null,1)});
menuInit();nav();save();hero(0);soc();setInterval(tick,1000);window.addEventListener("hashchange",route);route();loadP();if(typeof addSuccessListener=="function"){addSuccessListener(onOk);addFailedListener(onKo)}
</script>
