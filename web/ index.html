html{background:#fff;color-scheme:light}

</style>

var fF=function(n){return n.toLocaleString("fr-FR")+" F"};
/* VENTES FLASH : id du produit + son ancien prix réel (retirez old pour masquer la réduction). Valeurs actuelles = exemples */
var FL=[{id:4,old:17000},{id:5,old:20000},{id:6,old:30000}];
function fcard(x,o){var d=o>x.p?Math.round((1-x.p/o)*100):0;return '<div class="p fc2"><button class="pv" data-id="'+x.id+'">'+(d>0?'<span class="dc">-'+d+'%</span>':'')+'<span class="im">'+pic("img/p-"+x.id,x.e,x.n)+'</span><span class="nm">'+x.n+'</span><span class="pp"><b>'+fF(x.p)+'</b>'+(d>0?'<s>'+fF(o)+'</s>':'')+'</span></button><button class="btn add" data-add="'+x.id+'"'+(x.s<1?' disabled':'')+'>'+CI+'<span>Ajouter au panier</span></button></div>'}
var HB=$("hb"),RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches,HT=null,HS=null;
function dots(i){document.querySelectorAll("#hd button").forEach(function(b,j){b.className=j==i?"on":""})}
function play(){clearInterval(HT);HT=setInterval(function(){var w=HB.clientWidth;HB.scrollTo({left:(Math.round(HB.scrollLeft/w)+1)*w,behavior:RM?"auto":"smooth"})},3000)}
function slide(i){HB.scrollTo({left:i*HB.clientWidth,behavior:RM?"auto":"smooth"});play()}
function hero(){
HB.innerHTML=S.concat([S[0]]).map(function(s,j){var c=j==S.length;return '<div class="sl"'+(c?' aria-hidden="true"':'')+'><div><span class="pill"><i class="bz">'+BZ+'</i>'+s[0]+'</span><h1>'+s[1]+'</h1><p>Livraison rapide. Paiement par Mobile Money ou carte.</p><button class="btn" data-c="'+s[3]+'"'+(c?' tabindex="-1"':'')+'>'+s[2]+AR+'</button></div><div class="art">'+pic(s[5],s[4],"")+'</div></div>'}).join("");
$("hd").innerHTML=S.map(function(_,j){return '<button data-h="'+j+'" aria-label="Bannière '+(j+1)+'"></button>'}).join("");
dots(0);play()}
HB.addEventListener("scroll",function(){dots(Math.round(HB.scrollLeft/HB.clientWidth)%S.length);clearTimeout(HS);HS=setTimeout(function(){if(Math.round(HB.scrollLeft/HB.clientWidth)>=S.length)HB.scrollTo({left:0,behavior:"auto"})},150)});
HB.addEventListener("touchstart",function(){clearInterval(HT)},{passive:true});
HB.addEventListener("touchend",play);
var IC={fb:['Facebook','<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>'],ig:['Instagram','<rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.4A4 4 0 1 1 12.6 8 4 4 0 0 1 16 11.4z"/><path d="M17.5 6.5h.01"/>'],tt:['TikTok','<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>'],wa:['WhatsApp','<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>']};
function soc(){$("sc").innerHTML=["fb","ig","tt","wa"].filter(function(k){return LI[k]}).map(function(k){var u=k=="wa"?"https://wa.me/"+LI.wa:LI[k];return '<a href="'+u+'" target="_blank" rel="noopener" aria-label="'+IC[k][0]+'"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[k][1]+'</svg></a>'}).join("")}
function contact(){var a=[];
if(LI.wa)a.push('<a class="btn" href="https://wa.me/'+LI.wa+'" target="_blank" rel="noopener">Écrire sur WhatsApp</a>');
if(LI.tel)a.push('<a class="btn alt" href="tel:'+LI.tel.replace(/\s/g,"")+'">Appeler le '+LI.tel+'</a>');
if(LI.mail)a.push('<a class="btn alt" href="mailto:'+LI.mail+'">'+LI.mail+'</a>');
open('<h2>Nous contacter</h2><p>Une question sur un article ou une commande ? Choisissez le moyen qui vous convient.</p><div class="f">'+a.join("")+'<button class="btn alt" data-x>Fermer</button></div>')}
function list(){
var t=$("q").value.trim().toLowerCase(),r=+$("rm").value;
var l=P.filter(function(x){return (cat=="Tous"||x.c==cat)&&x.r>=r&&(!t||(x.n+x.c).toLowerCase().indexOf(t)>-1)});
var s=$("so").value;if(s==1)l.sort(function(a,b){return a.p-b.p});if(s==2)l.sort(function(a,b){return b.p-a.p});if(s==3)l.sort(function(a,b){return b.r-a.r});
$("h").textContent=cat=="Tous"?"Tous les articles":cat;$("cnt").textContent=l.length+" article"+(l.length>1?"s":"");
$("g").innerHTML=l.length?l.map(function(x){return card(x)}).join(""):'<p>Aucun article dans cette sélection pour le moment.</p>'}
function open(h){$("bx").className="box";$("bx").innerHTML=h;$("ov").classList.add("on")}
function close(){$("ov").classList.remove("on")}
function fiche(id){var x=P.filter(function(p){return p.id==id})[0];
open('<div class="im" style="height:160px;display:grid;place-items:center;font-size:5rem;border-radius:10px;background:'+x.col+'">'+pic("img/p-"+x.id,x.e,x.n)+'</div><h2>'+x.n+'</h2><div class="st">'+stars(x.r)+' <span class="mu">'+x.r+' · '+x.v+' avis vérifiés</span></div><p>'+x.d+'</p><p class="mu">Composition : '+x.m+'</p><div class="pr" style="font-size:1.3rem">'+fmt(x.p)+'</div><p class="mu">'+(x.s<1?'Épuisé':x.s+' en stock')+'</p><div style="display:flex;gap:8px"><button class="btn" data-add="'+x.id+'"'+(x.s<1?' disabled':'')+'>Ajouter au panier</button><button class="btn alt" data-x>Fermer</button></div>')}
function panier(){var ks=Object.keys(cart).filter(function(k){return cart[k]>0});
if(!ks.length){open('<h2>Votre panier est vide</h2><p>Ajoutez un article pour commencer.</p><button class="btn" data-x>Continuer mes achats</button>');return}
var tot=0,h='<div class="steps"><i class="on"></i><i></i><i></i></div><h2>Panier</h2>';
ks.forEach(function(k){var x=P.filter(function(p){return p.id==k})[0];tot+=x.p*cart[k];h+='<div class="row"><span><span class="th">'+pic("img/p-"+x.id,x.e,x.n)+'</span> '+x.n+'<br><span class="mu">'+fmt(x.p)+'</span></span><span class="qty"><button data-q="'+k+'" data-d="-1" aria-label="Retirer un">−</button> '+cart[k]+' <button data-q="'+k+'" data-d="1" aria-label="Ajouter un">+</button></span></div>'});
h+='<div class="row"><b>Total</b><b>'+fmt(tot)+'</b></div><p class="mu">Achat sans compte : aucune inscription requise.</p><div style="display:flex;gap:8px"><button class="btn" data-go="2">Passer la commande</button><button class="btn alt" data-x>Continuer</button></div>';open(h)}
function coord(){open('<div class="steps"><i class="on"></i><i class="on"></i><i></i></div><h2>Vos coordonnées</h2><div class="f"><input id="c1" placeholder="Nom complet" autocomplete="name"><input id="c2" type="email" placeholder="E-mail (pour le reçu)" autocomplete="email"><input id="c3" type="tel" placeholder="Téléphone" autocomplete="tel"><input id="c4" placeholder="Adresse de livraison" autocomplete="street-address"><button class="btn" data-go="3">Continuer vers le paiement</button></div><p id="er" class="mu"></p>')}
function loadP(){return fetch(CFG.API+"/products").then(function(r){return r.json()}).then(function(d){P=d.map(function(x){return{id:x.id,n:x.name,c:x.category,e:x.emoji,p:x.price,r:x.rating,v:x.reviews,d:x.description,m:x.composition,s:x.stock,col:"#f4f4f4"}});nav();list();flash()}).catch(function(){$("g").innerHTML="<p>Impossible de charger les articles. Réessayez dans un instant.</p>"})}
var cust={};
function pay(){var tot=0;Object.keys(cart).forEach(function(k){tot+=P.filter(function(p){return p.id==k})[0].p*cart[k]});open('<div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i></div><h2>Paiement</h2><p>Montant à payer : <b>'+fmt(tot)+'</b></p><p class="mu">Mobile money ou carte bancaire, via KKiaPay.</p><button class="btn" data-go="4">Payer avec KKiaPay</button>')}
function post(u,b){return fetch(CFG.API+u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||"Erreur");return d})})}
function pay2(){var b=document.querySelector('[data-go="4"]');b.disabled=true;b.textContent="Préparation…";
post("/orders",{customer:cust,items:Object.keys(cart).map(function(k){return{id:+k,qty:cart[k]}})}).then(function(o){cur=o.orderId;openKkiapayWidget({amount:o.amount,key:CFG.KKIAPAY_KEY,sandbox:CFG.SANDBOX,name:cust.name,email:cust.email,phone:cust.phone.replace(/\D/g,""),data:o.orderId,reason:"Commande Suppliers Window"})}).catch(function(e){b.disabled=false;b.textContent="Payer avec KKiaPay";alert(e.message)})}
function onOk(r){if(!cur)return;var id=cur;post("/orders/"+id+"/pay",{transactionId:r.transactionId}).then(function(){done(id)}).catch(function(e){open('<h2>Paiement à vérifier</h2><p>'+e.message+' Contactez-nous avec la référence '+id.slice(0,8)+'.</p><button class="btn" data-x>Fermer</button>')})}
function onKo(){open('<h2>Paiement non abouti</h2><p>Aucun montant n\'a été débité. Vous pouvez réessayer.</p><button class="btn" data-go="5">Réessayer</button>')}
function done(id){cart={};cur=null;save();loadP();open('<h2>Merci pour votre commande</h2><p>Un e-mail de confirmation vous est envoyé.</p><a class="btn" style="display:inline-block;text-decoration:none" href="'+CFG.API+'/orders/'+id+'/receipt.pdf" target="_blank" rel="noopener">Télécharger le reçu (PDF)</a> <button class="btn alt" data-x>Retour à la boutique</button>')}
document.addEventListener("click",function(e){var t=e.target.closest("button");if(!t)return;
if(t.dataset.c){cat=t.dataset.c;close();nav();list();$("h").scrollIntoView({behavior:"smooth"})}else if(t.dataset.ct)contact();else if(t.dataset.menu)menu();
else if(t.dataset.id)fiche(t.dataset.id);
else if(t.dataset.add){cart[t.dataset.add]=(cart[t.dataset.add]||0)+1;save();panier()}
else if(t.dataset.q){var k=t.dataset.q,x=P.filter(function(p){return p.id==k})[0];cart[k]=Math.max(0,Math.min(x.s,cart[k]+ +t.dataset.d));if(!cart[k])delete cart[k];save();panier()}
else if(t.dataset.go==2)coord();
else if(t.dataset.go==3){if(!$("c1").value||!/\S+@\S+/.test($("c2").value)||!$("c4").value){$("er").textContent="Renseignez votre nom, un e-mail valide et l'adresse de livraison.";return}cust={name:$("c1").value,email:$("c2").value,phone:$("c3").value,address:$("c4").value};pay()}
else if(t.dataset.go==4)pay2();else if(t.dataset.go==5)pay();
else if(t.dataset.x!==undefined)close();
else if(t.dataset.soon)open('<h2>Bientôt disponible</h2><p>Les comptes clients et les favoris arrivent dans la version en ligne.</p><button class="btn" data-x>Fermer</button>');else if(t.dataset.h!==undefined)slide(+t.dataset.h);else if(t.id=="sbt"){list();document.getElementById("g").scrollIntoView({behavior:"smooth"})}else if(t.id=="cb"||t.id=="cb2")panier();
else if(t.parentNode.id=="sug"){$("q").value=t.textContent;$("sug").style.display="none";list()}});
$("ov").addEventListener("click",function(e){if(e.target==$("ov"))close()});
$("q").addEventListener("input",function(){var t=this.value.trim().toLowerCase(),s=t?P.filter(function(x){return x.n.toLowerCase().indexOf(t)>-1}).slice(0,5):[];
$("sug").style.display=s.length?"block":"none";$("sug").innerHTML=s.map(function(x){return '<button>'+x.n+'</button>'}).join("");list()});
["rm","so"].forEach(function(i){$(i).addEventListener("input",list)});
$("nl").addEventListener("submit",function(e){e.preventDefault();$("nm").textContent="Merci, vous êtes inscrit.";e.target.reset()});
document.querySelector(".logo").addEventListener("click",function(e){e.preventDefault();close();cat="Tous";$("q").value="";$("rm").value="0";$("so").value="0";$("sug").style.display="none";nav();list();window.scrollTo({top:0,behavior:"smooth"})});
nav();save();hero(0);soc();setInterval(tick,1000);loadP();if(typeof addSuccessListener=="function"){addSuccessListener(onOk);addFailedListener(onKo)}
</script>
</body>
</html>
